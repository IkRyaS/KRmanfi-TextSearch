[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "krmanfi-search"
version = "1.0.0"
description = "Поиск по документам: текст в PDF, сканах, Office-файлах и ZIP-архивах (офлайн)."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "pyside6==6.11.2",
    "pydantic==2.13.5",
    "structlog==26.1.0",
    "platformdirs==4.12.3",
    "numpy==2.5.3",
    "pillow==12.3.0",
    "opencv-python-headless==4.14.0.94",
    "pymupdf==1.28.2",
    "python-docx==1.2.0",
    "openpyxl==3.1.5",
    "python-pptx==1.0.2",
    "pytesseract==0.3.13",
    "colorama>=0.4.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-qt==4.5.0",
    "ruff==0.16.10",
    "pyinstaller==6.22.3",
    "patchelf==0.17.2.4; sys_platform == 'linux'",
]

[project.scripts]
krmanfi-search = "krmanfi_search.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/krmanfi_search"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "ANN", "PLR0911", "RUF"]
ignore = ["D203", "D213", "ANN201", "ANN202", "ANN204", "ANN205", "ANN206", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
qt_api = "pyside6"
