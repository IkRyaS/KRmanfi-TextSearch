# Настройки KRmanfi Text Search. Файл необязателен: без него действуют значения по умолчанию.
# Если файл повреждён, программа покажет предупреждение и запустится с настройками по умолчанию.

# Число процессов для извлечения текста и распознавания. 0 — автоматически (ядра минус одно).
workers = 0

# Сколько символов контекста показывать вокруг найденного фрагмента.
context_chars = 60

# Файлы больше этого размера пропускаются (и попадают в список «пропущено»).
max_file_size_mb = 200

# Уровень журнала: DEBUG, INFO, WARNING, ERROR.
log_level = "INFO"

[ocr]
# Языки Tesseract. Нужны файлы rus.traineddata / eng.traineddata.
languages = ["rus", "eng"]

# Путь к tesseract, если он не найден автоматически (пример: "C:/Program Files/Tesseract-OCR/tesseract.exe").
# tesseract_cmd = ""

# Разрешение отрисовки страниц PDF перед распознаванием (72–600).
pdf_dpi = 300
