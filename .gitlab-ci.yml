stages: [check, build]

variables:
  UV_LINK_MODE: copy
  UV_PYTHON: "3.13"
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"

.linux:
  image: ubuntu:22.04
  before_script:
    - apt-get update -qq
    - >
      DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends
      curl ca-certificates tesseract-ocr tesseract-ocr-rus tesseract-ocr-eng
      libgl1 libegl1 libglib2.0-0 libfontconfig1 libdbus-1-3 libxkbcommon0
      libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
      libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 >/dev/null
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --extra dev --frozen

test:linux:
  stage: check
  extends: .linux
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - uv run ruff check src tests scripts
    - uv run pytest

build:linux:
  stage: build
  extends: .linux
  script:
    - export PATH="$HOME/.local/bin:$PATH"
    - uv run pyinstaller --noconfirm --clean krmanfi_search.spec
    - uv run python scripts/bundle_tesseract.py dist/KRmanfiSearch
    - uv run python scripts/package.py
    - uv run python scripts/smoke_test.py --exe dist/KRmanfi-TextSearch/KRmanfiSearch --require-ocr
    - uv run python scripts/make_source_zip.py
    - cat dist/SHA256SUMS.txt
  artifacts:
    paths:
      - dist/KRmanfi-TextSearch-linux-x64.tar.gz
      - dist/KRmanfi-TextSearch-source.zip
      - dist/SHA256SUMS.txt
    expire_in: 3 months

.windows:
  tags:
    - saas-windows-medium-amd64
  rules:
    - if: '$WINDOWS_RUNNER_ENABLED == "1"'
  before_script:
    - 'powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"'
    - '$env:PATH = "$env:USERPROFILE\.local\bin;$env:PATH"'
    - 'uv sync --extra dev --frozen'

test:windows:
  stage: check
  extends: .windows
  script:
    - choco install tesseract -y --no-progress
    - uv run ruff check src tests scripts
    - uv run pytest

build:windows:
  stage: build
  extends: .windows
  script:
    - choco install tesseract -y --no-progress
    - uv run pyinstaller --noconfirm --clean krmanfi_search.spec
    - uv run python scripts/bundle_tesseract.py dist/KRmanfiSearch
    - uv run python scripts/package.py
    - >
      uv run python scripts/smoke_test.py
      --exe dist/KRmanfi-TextSearch/KRmanfiSearch-console.exe --require-ocr
    - Get-Content dist/SHA256SUMS.txt
  artifacts:
    paths:
      - dist/KRmanfi-TextSearch-win64.zip
      - dist/SHA256SUMS.txt
    expire_in: 3 months
